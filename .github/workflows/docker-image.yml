name: Docker Image CI

on: push

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      if: ${{ github.ref_name == 'master' || github.ref_name == 'develop' }}
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: nuonic/node-python-awscli:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Report image size
      env:
        IMAGE: nuonic/node-python-awscli:${{ github.ref_name }}
      run: |
        uncompressed=$(docker image inspect "$IMAGE" --format '{{.Size}}')
        # Gzipped export approximates the compressed size Docker Hub reports
        compressed=$(docker save "$IMAGE" | gzip | wc -c)
        {
          echo "### Image size"
          echo "| | Size |"
          echo "|---|---|"
          echo "| Uncompressed (on disk) | $(numfmt --to=iec --suffix=B "$uncompressed") |"
          echo "| Compressed (approx. Docker Hub size) | $(numfmt --to=iec --suffix=B "$compressed") |"
          echo
          echo "<details><summary>Layers</summary>"
          echo
          echo '```'
          docker history --no-trunc --format 'table {{.Size}}\t{{.CreatedBy}}' "$IMAGE" | cut -c1-160
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Tag image as latest
      if: github.ref_name == 'master'
      run: docker image tag nuonic/node-python-awscli:${{ github.ref_name }} nuonic/node-python-awscli:latest

    - name: Tag image with versions
      if: github.ref_name == 'master'
      run: make tag

    - name: Push Docker image
      if: ${{ github.ref_name == 'master' || github.ref_name == 'develop' }}
      run: make push
