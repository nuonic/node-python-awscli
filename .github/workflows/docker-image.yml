name: Docker Image CI

on: push

env:
  IMAGE: nuonic/node-python-awscli

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read version from Makefile
      id: version
      run: |
        version=$(make -s version)
        echo "full=${version}" >> "$GITHUB_OUTPUT"
        echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
        echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

    # Every branch: :<branch> (moving) and :sha-<commit> (fixed)
    # master only:  :latest, :X.Y.Z, :X.Y, :X
    - name: Generate image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.full }},enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.major }},enable={{is_default_branch}}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Report image size
      env:
        IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        uncompressed=$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')
        # Gzipped export approximates the compressed size Docker Hub reports
        compressed=$(docker save "$IMAGE_REF" | gzip | wc -c)
        {
          echo "### Image"
          echo '```'
          echo "$TAGS"
          echo '```'
          echo "| | Size |"
          echo "|---|---|"
          echo "| Uncompressed (on disk) | $(numfmt --to=iec --suffix=B "$uncompressed") |"
          echo "| Compressed (approx. Docker Hub size) | $(numfmt --to=iec --suffix=B "$compressed") |"
          echo
          echo "<details><summary>Layers</summary>"
          echo
          echo '```'
          docker history --no-trunc --format 'table {{.Size}}\t{{.CreatedBy}}' "$IMAGE_REF" | cut -c1-160
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Push Docker image
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        while read -r tag; do
          docker push "$tag"
        done <<< "$TAGS"
